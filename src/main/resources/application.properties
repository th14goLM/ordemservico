spring.application.name=ordemservico

# Importa as variáveis do arquivo .env (na raiz do projeto)
spring.config.import=optional:file:.env[.properties]

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ordemservicodb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mensagem de erro no corpo da resposta
spring.web.error.include-message=always

# Swagger (SpringDoc)
springdoc.swagger-ui.path=/swagger-ui.html